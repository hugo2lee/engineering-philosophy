name: Repair chatgpt-plan-execute staging

on:
  push:
    branches:
      - feat/chatgpt-plan-execute

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feat/chatgpt-plan-execute

      - name: Re-run patch with literal file templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/patch-chatgpt-plan-execute.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(source[start:end]))
          code = re.sub(r"write\((\"[^\"]+\"), '''", r"write(\1, r'''", code)
          code = code.replace("note = '''", "note = r'''")
          code = code.replace("registry_add = '''", "registry_add = r'''")
          exec(compile(code, '<chatgpt-plan-execute-patch>', 'exec'), {'__name__': '__patch__'})
          PY

          chmod +x skills/chatgpt-plan-execute/scripts/prepare_handoff.py
          python3 -m unittest discover -s tests -p 'test_chatgpt_plan_execute_handoff.py'
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/chatgpt-plan-execute evals/chatgpt-plan-execute \
            tests/test_chatgpt_plan_execute_handoff.py skills/registry.yaml README.md \
            skills/engineering-philosophy/references/routing-matrix.md CHANGELOG.md ATTRIBUTION.md
          git commit -m "feat: add chatgpt plan execute workflow"
          git push origin HEAD:feat/chatgpt-plan-execute
